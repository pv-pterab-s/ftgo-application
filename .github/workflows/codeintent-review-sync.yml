name: Update CodeIntent review message
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: FTGO pull request number
        required: true
        type: number
      head_sha:
        description: Reviewed source commit
        required: true
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
concurrency:
  group: codeintent-review-sync-${{ inputs.pull_request }}
  cancel-in-progress: false

# The PR workflow set's version (review_service/VERSIONS.md, "Version numbers"): one number shared by
# codeintent-checks.yml, codeintent-review-sync.yml and codeintent-violations.yml. When any of the three
# changes, bump it to the next number (v000, v001, ...) in all three files together.
env:
  CODEINTENT_WORKFLOW_VERSION: v000

jobs:
  update:
    if: contains(fromJSON(vars.CODEINTENT_REVIEW_REPOSITORIES || '["pv-pterab-s/ftgo-application","scottswindell-hub/ftgo-application","Holonic-Technologies/ftgo-application"]'), github.repository) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ fromJSON(vars.CODEINTENT_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - name: Refresh the bot message from recorded review decisions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request }}
          HEAD_SHA: ${{ inputs.head_sha }}
          STATUS_API_URL: ${{ vars.CODEINTENT_STATUS_API_URL || 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/status' }}
          STATUS_PAGE_URL: ${{ vars.CODEINTENT_STATUS_PAGE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          CODEINTENT_PRIVATE_ENDPOINTS_CONFIGURED: ${{ vars.CODEINTENT_STATUS_API_URL != '' && vars.CODEINTENT_STATUS_PAGE_URL != '' }}
          CODEINTENT_BOT_LOGIN: ${{ vars.CODEINTENT_BOT_LOGIN || 'github-actions[bot]' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          from urllib.parse import urlencode
          repo, number, sha = os.environ['REPOSITORY'], os.environ['PR_NUMBER'], os.environ['HEAD_SHA']
          if os.environ.get('GITHUB_SERVER_URL', 'https://github.com') != 'https://github.com' and os.environ['CODEINTENT_PRIVATE_ENDPOINTS_CONFIGURED'] != 'true':
              raise SystemExit('Configure the private CODEINTENT_STATUS_API_URL and CODEINTENT_STATUS_PAGE_URL.')
          status_url = os.environ['STATUS_API_URL'].rstrip('/')
          page_url = os.environ['STATUS_PAGE_URL'].rstrip('/') + '/'
          if not number.isdigit() or int(number) < 1 or not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid PR or commit identity')
          def github(path, method='GET', body=None):
              request = urllib.request.Request(os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/') + path, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
                  data=json.dumps(body).encode() if body is not None else None)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          def current():
              pr = github(f'/repos/{repo}/pulls/{number}')
              return pr['state'] == 'open' and pr['head']['sha'] == sha
          if not current():
              raise SystemExit('PR changed or closed; refusing a stale message update')
          bot = None
          for page in range(1, 11):
              comments = github(f'/repos/{repo}/issues/{number}/comments?per_page=100&page={page}')
              bot = next((c for c in comments if c.get('user', {}).get('login') == os.environ['CODEINTENT_BOT_LOGIN']
                          and '<!-- codeintent-checks -->' in c.get('body', '')), None)
              if bot or len(comments) < 100:
                  break
          # Keep findings visible while Lambda renders the updated review projection.
          pending = None
          if not current():
              raise SystemExit('PR changed before refresh; refusing a stale message update')
          if bot:
              owner, name = repo.split('/', 1)
              spinner = f'<img src="{page_url}assets/checks-running.gif" width="20" height="20" alt="Updating review">'
              heading = '### CodeIntent checks -- ' + spinner + ' Updating review…'
              pending = re.sub(r'^### CodeIntent checks[^\n]*', lambda _: heading, bot['body'], count=1, flags=re.MULTILINE)
              if pending == bot['body']:
                  # Keep the versions span (or an older message's "Produced by" table and marker) last.
                  versions = re.search(r'<span title="__VERSION codeintent-versions-v1[\r\n"]|<details>\r?\n<summary>Produced by</summary>\r?\n'
                                       r'|<!-- codeintent-versions:v1 ', bot['body'])
                  at = versions.start() if versions else len(bot['body'])
                  pending = bot['body'][:at].rstrip('\n') + '\n\n' + heading + ('\n\n' + bot['body'][at:] if versions else '')
              github(f'/repos/{repo}/issues/comments/{bot["id"]}', 'PATCH', {'body': pending})
          try:
              query = {'repo': repo, 'sha': sha, 'detail': 'review-comment',
                       # Recorded as the "updater" version component (review_service/VERSIONS.md).
                       'workflow_version': os.environ.get('CODEINTENT_WORKFLOW_VERSION', ''),
                       'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF', ''),
                       'workflow_sha': os.environ.get('GITHUB_WORKFLOW_SHA', '')}
              if bot:
                  query['comment'] = str(bot['id'])
              url = status_url + '?' + urlencode(query)
              with urllib.request.urlopen(url, timeout=30) as response:
                  document = json.load(response)
              if document.get('head_sha') != sha or document.get('pull_request') != int(number) or not current():
                  raise SystemExit('Review identity changed; reload the current PR')
              body = document['body']
              if '<!-- codeintent-checks -->' not in body:
                  raise SystemExit('Missing authenticated review projection')
              # Exactly one versions span (review_service/VERSIONS.md), and none of the older format.
              markers = len(re.findall(r'<span title="__VERSION codeintent-versions-v1[\r\n"]', body))
              if markers != 1 or '<!-- codeintent-versions:v1 ' in body:
                  print(f'::warning::The review message carries {markers} component-version spans; expected exactly one __VERSION span.')
              if bot:
                  github(f'/repos/{repo}/issues/comments/{bot["id"]}', 'PATCH', {'body': body})
              else:
                  github(f'/repos/{repo}/issues/{number}/comments', 'POST', {'body': body})
              gate = document.get('finding_review_gate') or {}
              if (gate.get('application') != repo or gate.get('pull_request') != int(number)
                      or gate.get('head_commit') != sha):
                  raise SystemExit('Missing exact finding-review merge gate')
              status = gate.get('status')
              required, accepted = gate.get('required', 0), gate.get('accepted', 0)
              state = 'success' if status in {'ready', 'not_required'} else 'error' if status == 'unavailable' else 'failure'
              description = (f'All {required} review finding(s) accepted for this evidence'
                             if state == 'success' else 'Finding-review authority is unavailable'
                             if state == 'error' else f'{accepted} of {required} review finding(s) accepted')
              owner, name = repo.split('/', 1)
              report = page_url + '?' + urlencode(
                  {'repo': repo, 'pr': number, 'sha': sha,
                   'api': status_url.rsplit('/status', 1)[0]})
              github(f'/repos/{repo}/statuses/{sha}', 'POST', {
                  'state': state, 'context': 'CodeIntent / Finding review',
                  'description': description[:140], 'target_url': report})
          except (Exception, SystemExit):
              # Do not leave a spinner forever, or overwrite a newer pipeline comment.
              if bot and pending:
                  latest = github(f'/repos/{repo}/issues/comments/{bot["id"]}')
                  if latest.get('body') == pending:
                      failed = pending.replace(heading, '### CodeIntent checks -- ⚠️ Review update incomplete; retry from the review page', 1)
                      github(f'/repos/{repo}/issues/comments/{bot["id"]}', 'PATCH', {'body': failed})
              raise
          print('CodeIntent bot message updated from recorded review decisions.')
          PY
