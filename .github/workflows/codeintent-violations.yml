name: CodeIntent violations

# Findings are decided on the CodeIntent review page (Yes / No), not by comment.
# `/reject` and `/false-positive` are retired: this workflow only relays them so
# the API can reply with where to answer instead; nothing is recorded and the PR
# is never closed. `/codeintent-review` confirmations are still recorded.
# A writer's `/codeintent-review yes` on a failed coding-standards finding also
# records its rule exception: it applies to this PR at once (the checks are re-run
# here) and to the whole repository once the PR merges (codeintent-rule-exceptions.yml).
# Runs from the default branch: it never checks out PR code, and the comment text
# reaches the script only through an environment variable (it is untrusted input).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write          # reply in the PR conversation
  pull-requests: write   # reply in a review thread
  actions: write         # re-run the checks after a confirmed rule exception

concurrency:
  group: codeintent-violations-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  decide:
    if: >-
      github.event.comment.user.type != 'Bot'
      && (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
      && (contains(github.event.comment.body, '/reject') || contains(github.event.comment.body, '/false-positive') || contains(github.event.comment.body, '/codeintent-review'))
    runs-on: ${{ fromJSON(vars.CODEINTENT_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Record the decision and reply
        env:
          API_URL: ${{ vars.CODEINTENT_DECISIONS_URL || 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/disputes' }}
          API_KEY: ${{ secrets.DRIFT_GATE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          CODEINTENT_BOT_LOGIN: ${{ vars.CODEINTENT_BOT_LOGIN || 'github-actions[bot]' }}
          CODEINTENT_PRIVATE_ENDPOINT_CONFIGURED: ${{ vars.CODEINTENT_DECISIONS_URL != '' }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request
          from urllib.parse import urlsplit
          env = os.environ
          env['GH_HOST'] = urlsplit(env.get('GITHUB_SERVER_URL', 'https://github.com')).netloc
          if env['GH_HOST'] != 'github.com' and env['CODEINTENT_PRIVATE_ENDPOINT_CONFIGURED'] != 'true':
              raise SystemExit('Configure CODEINTENT_DECISIONS_URL for this private installation.')
          repo, number, actor = env['REPOSITORY'], env['PR_NUMBER'], env['ACTOR']

          # The bot message's "Produced by" section, as in governance_comment.py (review_service/VERSIONS.md).
          # Only that section and its one marker are replaced; `codeintent-review:` handles are never touched.
          import base64, re
          VERSIONS_SUMMARY = '<summary>Produced by</summary>'
          VERSIONS_MARKER = re.compile(r'<!-- codeintent-versions:v1 ([A-Za-z0-9_-]*) -->')
          VERSIONS_BLOCK = re.compile(r'(?:<details>\n' + re.escape(VERSIONS_SUMMARY) + r'\n.*?\n</details>\n)?'
                                      + VERSIONS_MARKER.pattern + r'\n?', re.S)

          def inline(value):
              return str(value or '').replace('\n',' ').replace('|','\\|').replace('<','&lt;').replace('>','&gt;')[:300]

          def parse_versions_marker(body):
              match = VERSIONS_MARKER.search(body or '')
              if not match:
                  return None
              try:
                  data = match.group(1)
                  chain = json.loads(base64.urlsafe_b64decode(data + '=' * (-len(data) % 4)).decode('utf-8'))
              except ValueError:
                  return None
              return chain if isinstance(chain, dict) and isinstance(chain.get('components'), list) else None

          def versions_lines(chain):
              entries = [c for c in (chain or {}).get('components') or [] if isinstance(c, dict)]
              if not entries:
                  return []
              data = json.dumps({**chain, 'components': entries}, separators=(',', ':'), sort_keys=True, default=str).encode('utf-8')
              table = [f"| {inline(c.get('name') or c.get('id'))} | {inline(c.get('version'))} |" for c in entries]
              return ['<details>', VERSIONS_SUMMARY, '', '| Component | Version |', '|---|---|', *table, '', '</details>',
                      '<!-- codeintent-versions:v1 ' + base64.urlsafe_b64encode(data).decode('ascii').rstrip('=') + ' -->']

          def replace_versions_block(body, chain):
              block = '\n'.join(versions_lines(chain))
              rest = VERSIONS_BLOCK.sub('', body or '')
              if not block:
                  return rest
              return rest + ('' if not rest or rest.endswith('\n\n') else '\n' if rest.endswith('\n') else '\n\n') + block + '\n'

          def gh(*args, payload=None):
              run = subprocess.run(['gh', 'api', *args] + (['--input', '-'] if payload is not None else []),
                                   input=json.dumps(payload) if payload is not None else None,
                                   capture_output=True, text=True)
              return run.stdout if run.returncode == 0 else None

          current_pr = json.loads(gh(f'repos/{repo}/pulls/{number}') or '{}')
          if current_pr.get('state') != 'open':
              raise SystemExit('::warning::Review commands require an open PR.')
          head = current_pr['head']['sha']
          # The API decides what the commenter's permission allows.
          permission = (gh(f'repos/{repo}/collaborators/{actor}/permission', '--jq', '.permission') or 'none').strip()
          if permission not in {'admin', 'maintain', 'write', 'triage', 'read', 'none'}:
              permission = 'none'
          payload = {'repository': repo, 'pull_request': int(number), 'head_sha': head,
                     'comment_id': int(env['COMMENT_ID']), 'comment_url': env['COMMENT_URL'],
                     'actor': actor, 'actor_permission': permission, 'body': env['COMMENT_BODY']}
          if not env['API_KEY']:
              raise SystemExit('::error::Configure the DRIFT_GATE_API_KEY repository secret.')
          request = urllib.request.Request(env['API_URL'], data=json.dumps(payload).encode(), method='POST',
              headers={'x-api-key': env['API_KEY'], 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'::error::CodeIntent decisions API returned HTTP {exc.code}: '
                               + exc.read().decode(errors='replace')[:500])
          print(json.dumps({'recorded': result.get('recorded', 0)}))
          if result.get('comment_body'):
              latest = json.loads(gh(f'repos/{repo}/pulls/{number}') or '{}')
              if latest.get('head', {}).get('sha') != result.get('head_sha'):
                  raise SystemExit('::warning::PR changed after recording; reload the latest review.')
              pages = json.loads(gh('--paginate', '--slurp', f'repos/{repo}/issues/{number}/comments?per_page=100') or '[]')
              bot = next((c for page in pages for c in page if c.get('user', {}).get('login') == env['CODEINTENT_BOT_LOGIN']
                          and '<!-- codeintent-checks -->' in c.get('body', '')), None)
              comment_body = result['comment_body']
              if bot and not VERSIONS_MARKER.search(comment_body):
                  # Carry the existing "Produced by" chain over and record this workflow as its updater.
                  chain = parse_versions_marker(bot.get('body', '')) or {'schema': 'codeintent-versions-v1', 'components': []}
                  sha12 = (env.get('GITHUB_WORKFLOW_SHA') or 'unrecorded')[:12]
                  chain['components'] = [c for c in chain['components'] if isinstance(c, dict) and c.get('id') != 'updater'] + [
                      {'id': 'updater', 'name': 'Updated by', 'version': 'codeintent-violations.yml@' + sha12}]
                  comment_body = replace_versions_block(comment_body, chain)
              if not bot or gh('--method', 'PATCH', f'repos/{repo}/issues/comments/{bot["id"]}',
                               payload={'body': comment_body}) is None:
                  raise SystemExit('::error::Decision recorded, but the bot comment was not updated. Retry this Actions run.')
          if not result.get('reply'):
              raise SystemExit(0)   # an ordinary comment that only mentions a command

          if env['EVENT_NAME'] == 'pull_request_review_comment':
              target = f'repos/{repo}/pulls/{number}/comments/{env["COMMENT_ID"]}/replies'
          else:
              target = f'repos/{repo}/issues/{number}/comments'
          if gh('--method', 'POST', target, '-f', 'body=' + result['reply']) is None:
              print('::warning::Could not post the reply:\n' + result['reply'])
          if result.get('rerun_checks'):
              # The PR's checks apply the recorded exception straight from the ledger; nothing is committed.
              default = json.loads(gh(f'repos/{repo}') or '{}').get('default_branch', 'master')
              started = gh('--method', 'POST', f'repos/{repo}/actions/workflows/codeintent-checks.yml/dispatches',
                           payload={'ref': default, 'inputs': {'pull_request': number}})
              if started is None:
                  raise SystemExit('::error::The answer was recorded, but the checks could not be re-run. '
                                   'Re-run CodeIntent Checks for this PR.')
          PY
