name: CodeIntent violations

# Findings are decided on the CodeIntent review page (Yes / No), not by comment.
# `/reject` and `/false-positive` are retired: this workflow only relays them so
# the API can reply with where to answer instead; nothing is recorded and the PR
# is never closed. `/codeintent-review` confirmations are still recorded.
# A writer's `/codeintent-review yes` on a failed coding-standards finding also
# records its rule exception: it applies to this PR at once (the checks are re-run
# here) and to the whole repository once the PR merges (codeintent-rule-exceptions.yml).
# Runs from the default branch: it never checks out PR code, and the comment text
# reaches the script only through an environment variable (it is untrusted input).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write          # reply in the PR conversation
  pull-requests: write   # reply in a review thread
  actions: write         # re-run the checks after a confirmed rule exception

concurrency:
  group: codeintent-violations-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

# The PR workflow set's version (review_service/VERSIONS.md, "Version numbers"): one number shared by
# codeintent-checks.yml, codeintent-review-sync.yml and codeintent-violations.yml. When any of the three
# changes, bump it to the next number (v000, v001, ...) in all three files together.
env:
  CODEINTENT_WORKFLOW_VERSION: v000

jobs:
  decide:
    if: >-
      github.event.comment.user.type != 'Bot'
      && (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
      && (contains(github.event.comment.body, '/reject') || contains(github.event.comment.body, '/false-positive') || contains(github.event.comment.body, '/codeintent-review'))
    runs-on: ${{ fromJSON(vars.CODEINTENT_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - name: Record the decision and reply
        env:
          API_URL: ${{ vars.CODEINTENT_DECISIONS_URL || 'https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/disputes' }}
          API_KEY: ${{ secrets.DRIFT_GATE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          CODEINTENT_BOT_LOGIN: ${{ vars.CODEINTENT_BOT_LOGIN || 'github-actions[bot]' }}
          CODEINTENT_PRIVATE_ENDPOINT_CONFIGURED: ${{ vars.CODEINTENT_DECISIONS_URL != '' }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.error, urllib.request
          from urllib.parse import urlsplit
          env = os.environ
          env['GH_HOST'] = urlsplit(env.get('GITHUB_SERVER_URL', 'https://github.com')).netloc
          if env['GH_HOST'] != 'github.com' and env['CODEINTENT_PRIVATE_ENDPOINT_CONFIGURED'] != 'true':
              raise SystemExit('Configure CODEINTENT_DECISIONS_URL for this private installation.')
          repo, number, actor = env['REPOSITORY'], env['PR_NUMBER'], env['ACTOR']

          # The bot message's versions span, copied from governance_comment.py (review_service/VERSIONS.md), including
          # the removal of the older "Produced by" table and marker. Only the span is replaced; `codeintent-review:`
          # handles are never touched.
          import base64, re
          from urllib.parse import quote, unquote
          VERSIONS_SCHEMA = 'codeintent-versions-v1'
          MESSAGE_LIMIT = 65536   # GitHub's comment size: the versions span must never push a message past it
          # The chain is an empty <span> whose title holds one readable line per component (review_service/VERSIONS.md).
          VERSIONS_HEAD = '__VERSION ' + VERSIONS_SCHEMA
          VERSIONS_SPAN = re.compile(r'<span title="' + VERSIONS_HEAD + r'(?P<lines>(?:\r?\n[^"<>&]*)?)"></span>')
          VERSIONS_SPAN_BLOCK = re.compile(VERSIONS_SPAN.pattern + r'[ \t]*(?:\r?\n)?')
          # Characters left readable in a value: none of them is special inside a double-quoted HTML attribute or in a
          # line's grammar. Everything else (%, comma, =, parentheses, brackets, quotes, <, >, &, backslash, control
          # characters, non-ASCII) is percent-encoded, as is a leading or trailing space and a name's first character
          # unless it is an ASCII letter (so no line can start a Markdown block).
          VERSIONS_SAFE = " /:@+~._-'*!$;?#{}|^`"
          VERSIONS_LINE = re.compile(r'(?P<name>[^\[]*?) ?\[(?P<id>[^\]]*)\]:(?: (?P<version>[^(]*?))?(?: \((?P<detail>[^()]*)\))?')
          # The earlier format: a collapsed "Produced by" table and a hidden base64url JSON comment. It is still read, and
          # removed whenever a message is updated.
          OLD_VERSIONS_MARKER = re.compile(r'<!-- codeintent-versions:v1 ([A-Za-z0-9_-]*) -->')
          OLD_VERSIONS_BLOCK = re.compile(r'<details>\r?\n<summary>Produced by</summary>\r?\n.*?\r?\n</details>\r?\n?'
                                          r'(?:' + OLD_VERSIONS_MARKER.pattern + r'[ \t]*(?:\r?\n)?)?|'
                                          + OLD_VERSIONS_MARKER.pattern + r'[ \t]*(?:\r?\n)?', re.S)


          def versions_quote(value, first=False):
              """Percent-encode one value so the line round-trips through unquote and stays inert in the attribute."""
              text=quote('' if value is None else str(value), safe=VERSIONS_SAFE)
              if text[:1]==' ' or (first and text[:1] and text[0]!='%' and not ('a'<=text[0].lower()<='z')):
                  text='%{:02X}'.format(ord(text[0]))+text[1:]
              if text[-1:]==' ':
                  text=text[:-1]+'%20'
              return text


          def versions_line(component, detail=True):
              """`<name> [<id>]: <version>`, then ` (k=v, ...)` when the component has detail."""
              line=(versions_quote(component.get('name'), first=True)+' ['+versions_quote(component.get('id'))+']: '
                    +versions_quote(component.get('version')))
              pairs=component.get('detail') if detail and isinstance(component.get('detail'),dict) else {}
              if pairs:
                  line+=' ('+', '.join(versions_quote(k)+'='+versions_quote(v) for k,v in pairs.items())+')'
              return line


          def versions_marker(chain, detail=True):
              """The versions span: empty, so nothing shows on the page; its title carries the chain, one line per component."""
              entries=[c for c in (chain or {}).get('components') or [] if isinstance(c,dict)]
              return '<span title="'+'\n'.join([VERSIONS_HEAD,*(versions_line(c,detail) for c in entries),''])+'"></span>'


          def parse_versions_span(text):
              """The chain from a span's lines; every component comes back with a `detail` dict (empty when none was shown)."""
              components=[]
              for line in re.split(r'\r?\n',text):
                  if not line.strip():
                      continue
                  match=VERSIONS_LINE.fullmatch(line.strip())
                  if not match:
                      return None
                  detail={}
                  for pair in match['detail'].split(',') if match['detail'] is not None else []:
                      key,equals,value=pair[1:].partition('=') if pair.startswith(' ') else pair.partition('=')
                      if not equals:
                          return None
                      detail[unquote(key)]=unquote(value)
                  components.append({'id':unquote(match['id']),'name':unquote(match['name']),
                                     'version':unquote(match['version'] or ''),'detail':detail})
              return {'schema':VERSIONS_SCHEMA,'components':components}


          def parse_versions_marker(body):
              """The chain from the message's versions span, or from the earlier hidden marker when there is no span."""
              match=VERSIONS_SPAN.search(body or '')
              if match:
                  return parse_versions_span(match['lines'])
              match=OLD_VERSIONS_MARKER.search(body or '')
              if not match:
                  return None
              try:
                  data=match.group(1)
                  chain=json.loads(base64.urlsafe_b64decode(data+'='*(-len(data)%4)).decode('utf-8'))
              except ValueError:
                  return None
              return chain if isinstance(chain,dict) and isinstance(chain.get('components'),list) else None


          def versions_lines(chain, room=None):
              """The versions span as the message's last block; nothing without a chain.

              With `room` (characters left in the message), a span that does not fit drops each component's detail, and is
              left out when even that does not fit.
              """
              entries=[c for c in (chain or {}).get('components') or [] if isinstance(c,dict)]
              if not entries:
                  return []
              span=versions_marker({**chain, 'components': entries})
              if room is None or len(span)<room:
                  return [span]
              span=versions_marker({**chain, 'components': entries}, detail=False)
              return [span] if len(span)<room else []


          def remove_versions_blocks(body):
              """The message without any versions span, "Produced by" table or earlier hidden marker."""
              return OLD_VERSIONS_BLOCK.sub('',VERSIONS_SPAN_BLOCK.sub('',body or ''))


          def replace_versions_block(body, chain):
              """Swap the message's versions for this chain, or append them; exactly one span remains, last."""
              rest=remove_versions_blocks(body)
              block='\n'.join(versions_lines(chain, MESSAGE_LIMIT-len(rest)-3))
              if not block:
                  return rest
              return rest+('' if not rest or rest.endswith('\n\n') else '\n' if rest.endswith('\n') else '\n\n')+block+'\n'

          def gh(*args, payload=None):
              run = subprocess.run(['gh', 'api', *args] + (['--input', '-'] if payload is not None else []),
                                   input=json.dumps(payload) if payload is not None else None,
                                   capture_output=True, text=True)
              return run.stdout if run.returncode == 0 else None

          current_pr = json.loads(gh(f'repos/{repo}/pulls/{number}') or '{}')
          if current_pr.get('state') != 'open':
              raise SystemExit('::warning::Review commands require an open PR.')
          head = current_pr['head']['sha']
          # The API decides what the commenter's permission allows.
          permission = (gh(f'repos/{repo}/collaborators/{actor}/permission', '--jq', '.permission') or 'none').strip()
          if permission not in {'admin', 'maintain', 'write', 'triage', 'read', 'none'}:
              permission = 'none'
          payload = {'repository': repo, 'pull_request': int(number), 'head_sha': head,
                     'comment_id': int(env['COMMENT_ID']), 'comment_url': env['COMMENT_URL'],
                     'actor': actor, 'actor_permission': permission, 'body': env['COMMENT_BODY']}
          if not env['API_KEY']:
              raise SystemExit('::error::Configure the DRIFT_GATE_API_KEY repository secret.')
          request = urllib.request.Request(env['API_URL'], data=json.dumps(payload).encode(), method='POST',
              headers={'x-api-key': env['API_KEY'], 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'::error::CodeIntent decisions API returned HTTP {exc.code}: '
                               + exc.read().decode(errors='replace')[:500])
          print(json.dumps({'recorded': result.get('recorded', 0)}))
          if result.get('comment_body'):
              latest = json.loads(gh(f'repos/{repo}/pulls/{number}') or '{}')
              if latest.get('head', {}).get('sha') != result.get('head_sha'):
                  raise SystemExit('::warning::PR changed after recording; reload the latest review.')
              pages = json.loads(gh('--paginate', '--slurp', f'repos/{repo}/issues/{number}/comments?per_page=100') or '[]')
              bot = next((c for page in pages for c in page if c.get('user', {}).get('login') == env['CODEINTENT_BOT_LOGIN']
                          and '<!-- codeintent-checks -->' in c.get('body', '')), None)
              comment_body = result['comment_body']
              if not VERSIONS_SPAN.search(comment_body) and OLD_VERSIONS_MARKER.search(comment_body):
                  # Rendered by an older renderer: the same chain, as the versions span.
                  comment_body = replace_versions_block(comment_body, parse_versions_marker(comment_body))
              elif bot and not VERSIONS_SPAN.search(comment_body):
                  # Carry the analysis chain over. The entries that described the previous rendering do not describe this
                  # text: the decisions API rendered it and records no version, and this workflow posted it.
                  chain = parse_versions_marker(bot.get('body', '')) or {'schema': 'codeintent-versions-v1', 'components': []}
                  version = env.get('CODEINTENT_WORKFLOW_VERSION', '')
                  version = version if re.fullmatch(r'v[0-9]{3}', version) else 'unrecorded'
                  chain['components'] = [c for c in chain['components'] if isinstance(c, dict)
                                         and c.get('id') not in {'renderer', 'page', 'status-service', 'updater'}] + [
                      {'id': 'renderer', 'name': 'Message renderer', 'version': 'unrecorded', 'detail': {'by': 'decisions API'}},
                      {'id': 'updater', 'name': 'Updated by', 'version': version,
                       'detail': {'file': 'codeintent-violations.yml', 'sha': env.get('GITHUB_WORKFLOW_SHA') or 'unrecorded'}}]
                  comment_body = replace_versions_block(comment_body, chain)
              if not bot or gh('--method', 'PATCH', f'repos/{repo}/issues/comments/{bot["id"]}',
                               payload={'body': comment_body}) is None:
                  raise SystemExit('::error::Decision recorded, but the bot comment was not updated. Retry this Actions run.')
          if not result.get('reply'):
              raise SystemExit(0)   # an ordinary comment that only mentions a command

          if env['EVENT_NAME'] == 'pull_request_review_comment':
              target = f'repos/{repo}/pulls/{number}/comments/{env["COMMENT_ID"]}/replies'
          else:
              target = f'repos/{repo}/issues/{number}/comments'
          if gh('--method', 'POST', target, '-f', 'body=' + result['reply']) is None:
              print('::warning::Could not post the reply:\n' + result['reply'])
          if result.get('rerun_checks'):
              # The PR's checks apply the recorded exception straight from the ledger; nothing is committed.
              default = json.loads(gh(f'repos/{repo}') or '{}').get('default_branch', 'master')
              started = gh('--method', 'POST', f'repos/{repo}/actions/workflows/codeintent-checks.yml/dispatches',
                           payload={'ref': default, 'inputs': {'pull_request': number}})
              if started is None:
                  raise SystemExit('::error::The answer was recorded, but the checks could not be re-run. '
                                   'Re-run CodeIntent Checks for this PR.')
          PY
